# Builds Hatchr desktop for Windows, macOS and Linux on their own machines, then puts all
# installers on one GitHub Release named after the version in package.json (v3.3.0 ...).
# Runs on every push to main that changes the app, on a v* tag, or by hand from the Actions tab.
# Pushing the same version again replaces that release's files; bump "version" for a new release.
# File names have no version in them, so these links always point at the newest build:
#   https://github.com/sologgg/hatchr/releases/latest/download/Hatchr-Setup.exe
#   https://github.com/sologgg/hatchr/releases/latest/download/Hatchr-mac.dmg
#   https://github.com/sologgg/hatchr/releases/latest/download/Hatchr-linux.AppImage
#   https://github.com/sologgg/hatchr/releases/latest/download/Hatchr-linux.deb
name: Build desktop apps
on:
  pull_request:
    paths:
      - "app/**"
      - "build/**"
      - "*.js"
      - "*.mjs"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  push:
    branches: [main, build-test]   # build-test: build only, no release
    tags: ["v*"]
    paths:
      - "app/**"
      - "build/**"
      - "*.js"
      - "*.mjs"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:
# Building only needs to read the code. Only the release job may write (it publishes the files).
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            name: windows
          - os: macos-latest
            target: --mac
            name: mac
          - os: ubuntu-latest
            target: --linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - if: matrix.name == 'linux'
        run: xvfb-run -a npx electron tests/electron-callouts.cjs --no-sandbox
      # app/ holds the built Chrome extension (committed), so there is no sync step here
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # the animated Windows installer (Squirrel) is written to dist/squirrel-windows/
      - if: matrix.name == 'windows'
        shell: bash
        run: cp dist/squirrel-windows/Hatchr-Setup.exe dist/ && ls -la dist dist/squirrel-windows
      - if: matrix.name == 'linux'
        run: cd app && zip -r ../dist/Hatchr-extension.zip . -x 'background.html' 'tests/*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hatchr-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/Hatchr-Setup.exe
            dist/Hatchr-win.zip
            dist/Hatchr-mac.dmg
            dist/Hatchr-linux.AppImage
            dist/Hatchr-linux.deb
            dist/Hatchr-extension.zip

  release:
    needs: build
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: package.json
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      # checksums, so anyone can check a download against what was built here
      - run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Hatchr ${{ steps.ver.outputs.version }}
          make_latest: "true"
          body: |
            Hatchr desktop app. The main way to use Hatchr is the Chrome extension; this is the same tool as a standalone app. Website and privacy policy: https://hatchr.pro

            | System | File |
            |---|---|
            | Windows 10/11 (64-bit) | **Hatchr-Setup.exe** (installer) or Hatchr-win.zip (portable) |
            | macOS 13 Ventura or newer (Apple Silicon and Intel) | **Hatchr-mac.dmg** |
            | Linux (64-bit) | **Hatchr-linux.AppImage** or Hatchr-linux.deb |
            | Chrome / Chromium (unpacked) | **Hatchr-extension.zip** |

            Direct callouts: send from Hatchr without opening Pump.fun for every post.
            In the desktop app, use the Pump.fun button to sign in once; this login is separate from Chrome.
            Existing Pump.fun eligibility and holding requirements still apply.

            **First start**
            - Windows: SmartScreen may say "Windows protected your PC". Click *More info*, then *Run anyway*. Hatchr then installs by itself in a few seconds and opens.
            - macOS: open the dmg, drag the egg into Applications, open it once, then go to System Settings → Privacy & Security and click *Open Anyway*.
            - Linux: make the AppImage executable (`chmod +x Hatchr-linux.AppImage`) and run it, or install the deb.
          files: out/*
