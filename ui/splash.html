<!doctype html>
<!--
  Hatchr's hatching egg.
  splash.html            the app's start-up splash (transparent window, plays once)
  splash.html#installer  the Windows installer screen (full-bleed card, loops); captured into build/install.gif
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hatchr</title>
<style>
@font-face { font-family: "HInter"; font-weight: 600; src: url("fonts/inter-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "HInter"; font-weight: 700; src: url("fonts/inter-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "HInter"; font-weight: 800; src: url("fonts/inter-latin-800-normal.woff2") format("woff2"); }
:root {
  --bg: #0e0f12; --panel: #15161a; --line: #26282e; --text: #f4f4f5; --muted: #8e909b; --green: #86efac; --green-2: #4ade80;
  --dur: 1.7s; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
body { display: grid; place-items: center; font-family: "HInter", "Segoe UI", system-ui, sans-serif; color: var(--text); }

.card {
  width: 280px; height: 300px; border-radius: 26px; position: relative; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 38%, #142019 0%, var(--bg) 62%);
  border: 1px solid var(--line); box-shadow: 0 24px 60px -18px rgba(0, 0, 0, .75);
  display: grid; justify-items: center; align-content: center; gap: 4px; padding-bottom: 6px;
}
.egg { width: 168px; height: 176px; display: block; margin-bottom: -6px; overflow: visible; }
.title { font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
.sub { font-weight: 600; font-size: 12.5px; color: var(--muted); }
.bar { width: 124px; height: 4px; border-radius: 99px; background: #23252b; overflow: hidden; margin-top: 10px; }
.bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--green-2), var(--green)); }

/* ---- the egg ---- */
.egg * { transform-box: view-box; }
.wobble { transform-origin: 64px 122px; }
.lid { transform-origin: 58px 40px; }
.glow { transform-origin: 64px 66px; opacity: 0; }
.crack { stroke: #0e0f12; }
.egg .spark { opacity: 0; transform-box: fill-box; transform-origin: center; }
.shadow { transform-origin: 64px 128px; }

/* splash: plays once and holds the open egg */
.wobble { animation: wobble var(--dur) ease-in-out both; }
.lid { animation: lid var(--dur) cubic-bezier(.2, .9, .25, 1.15) both; }
.glow { animation: glow var(--dur) ease-out both; }
.crack { animation: crack var(--dur) linear both; }
.spark { animation: spark var(--dur) ease-out both; }
.shadow { animation: shadow var(--dur) ease-in-out both; }
.title, .sub, .bar { animation: rise .5s .15s ease-out both; }
.bar i { animation: slide 1.3s ease-in-out infinite; }

@keyframes wobble { 0% { rotate: 0deg } 8% { rotate: -8deg } 16% { rotate: 7deg } 24% { rotate: -5deg } 31% { rotate: 3deg } 37%, 100% { rotate: 0deg } }
@keyframes shadow { 0%, 37%, 100% { scale: 1 } 8%, 24% { scale: .9 1 } 16% { scale: 1.06 1 } }
@keyframes crack { 0%, 36% { stroke: #0e0f12 } 42%, 100% { stroke: #bbf7d0 } }
@keyframes lid {
  0%, 40% { translate: 0 0; rotate: 0deg }
  52% { translate: 8px -42px; rotate: 22deg }
  62%, 100% { translate: 6px -34px; rotate: 16deg }
}
@keyframes glow { 0%, 40% { opacity: 0; scale: .5 } 55% { opacity: 1; scale: 1.08 } 100% { opacity: .8; scale: 1 } }
@keyframes spark {
  0%, 42% { opacity: 0; translate: 0 0; scale: .3 }
  50% { opacity: 1 }
  78% { opacity: 0; translate: var(--dx) var(--dy); scale: 1.5 }
  100% { opacity: 0; translate: var(--dx) var(--dy) }
}
@keyframes rise { from { opacity: 0; translate: 0 6px } }
@keyframes slide { 0% { translate: -110% 0 } 100% { translate: 260% 0 } }

/* installer: full-bleed card, the egg opens and closes in a loop */
html.installer { --dur: 2.6s; }
html.installer body { display: block; }
html.installer .card { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; border-color: #23252b; }
html.installer .wobble, html.installer .lid, html.installer .glow, html.installer .crack, html.installer .spark, html.installer .shadow { animation-iteration-count: infinite; }
html.installer .lid { animation-name: lidLoop; }
html.installer .glow { animation-name: glowLoop; }
html.installer .crack { animation-name: crackLoop; }
html.installer .title, html.installer .sub, html.installer .bar { animation: none; }
html.installer .title { font-size: 21px; }
@keyframes lidLoop {
  0%, 40% { translate: 0 0; rotate: 0deg }
  52% { translate: 8px -42px; rotate: 22deg }
  62%, 80% { translate: 6px -34px; rotate: 16deg }
  92%, 100% { translate: 0 0; rotate: 0deg }
}
@keyframes glowLoop { 0%, 40% { opacity: 0; scale: .5 } 55% { opacity: 1; scale: 1.08 } 80% { opacity: .8; scale: 1 } 94%, 100% { opacity: 0; scale: .6 } }
@keyframes crackLoop { 0%, 36% { stroke: #0e0f12 } 42%, 86% { stroke: #bbf7d0 } 94%, 100% { stroke: #0e0f12 } }

@media (prefers-reduced-motion: reduce) { .wobble, .shadow, .spark { animation: none !important; } }
</style>
</head>
<body>
<div class="card">
  <svg class="egg" viewBox="-20 -40 168 176" aria-hidden="true">
    <defs>
      <clipPath id="shell"><path d="M64 8C41 8 22 44 22 74c0 27 18 46 42 46s42-19 42-46C106 44 87 8 64 8z"/></clipPath>
      <clipPath id="top"><path d="M-40 -40H168V66L106 74 92 60 78 76 64 62 50 76 36 62 22 74-40 66z"/></clipPath>
      <clipPath id="bottom"><path d="M-40 66 22 74 36 62 50 76 64 62 78 76 92 60 106 74 168 66V168H-40z"/></clipPath>
      <linearGradient id="gr" x1="30" y1="60" x2="100" y2="124" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#86EFAC"/><stop offset="1" stop-color="#4ADE80"/></linearGradient>
      <linearGradient id="wh" x1="40" y1="8" x2="90" y2="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9ECEF"/></linearGradient>
      <radialGradient id="gl" cx="64" cy="66" r="72" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#86EFAC" stop-opacity=".55"/><stop offset=".45" stop-color="#4ADE80" stop-opacity=".18"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0"/></radialGradient>
      <path id="star" d="M0-8C.8-2.2 2.2-.8 8 0 2.2.8.8 2.2 0 8-.8 2.2-2.2.8-8 0-2.2-.8-.8-2.2 0-8z"/>
      <path id="o" d="M64 8C41 8 22 44 22 74c0 27 18 46 42 46s42-19 42-46C106 44 87 8 64 8z"/>
      <path id="z" d="M14 70 22 74 36 62 50 76 64 62 78 76 92 60 106 74 114 70"/>
    </defs>
    <circle class="glow" cx="64" cy="66" r="72" fill="url(#gl)"/>
    <ellipse class="shadow" cx="64" cy="128" rx="30" ry="4.5" fill="#000" opacity=".45"/>
    <g class="wobble">
      <!-- bottom half: green -->
      <g transform="rotate(-28 64 66)"><g clip-path="url(#bottom)">
        <g clip-path="url(#shell)">
          <rect x="-40" y="-40" width="208" height="208" fill="url(#gr)"/>
          <use class="crack" href="#z" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
        </g>
        <use href="#o" fill="none" stroke="#0e0f12" stroke-width="7"/>
      </g></g>
      <!-- top half: white shell that pops off -->
      <g class="lid"><g transform="rotate(-28 64 66)"><g clip-path="url(#top)">
        <g clip-path="url(#shell)">
          <rect x="-40" y="-40" width="208" height="208" fill="url(#wh)"/>
          <ellipse cx="48" cy="34" rx="7" ry="13" fill="#fff" opacity=".9" transform="rotate(20 48 34)"/>
          <use class="crack" href="#z" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
        </g>
        <use href="#o" fill="none" stroke="#0e0f12" stroke-width="7"/>
      </g></g></g>
      <!-- sparks out of the crack -->
      <g transform="translate(64 62)">
        <use class="spark" href="#star" fill="#bbf7d0" style="--dx:-46px;--dy:-30px"/>
        <use class="spark" href="#star" fill="#fff" style="--dx:44px;--dy:-40px;animation-delay:.04s"/>
        <use class="spark" href="#star" fill="#86efac" style="--dx:-12px;--dy:-58px;animation-delay:.02s"/>
        <use class="spark" href="#star" fill="#86efac" style="--dx:56px;--dy:-6px;animation-delay:.06s"/>
        <use class="spark" href="#star" fill="#fff" style="--dx:-58px;--dy:2px;animation-delay:.03s"/>
        <use class="spark" href="#star" fill="#bbf7d0" style="--dx:20px;--dy:-62px;animation-delay:.05s"/>
      </g>
    </g>
  </svg>
  <div class="title" id="title">Hatchr</div>
  <div class="sub" id="sub">Starting up…</div>
  <div class="bar"><i></i></div>
</div>
<script>
  if (location.hash === "#installer") {
    document.documentElement.classList.add("installer");
    document.getElementById("title").textContent = "Installing Hatchr";
    document.getElementById("sub").textContent = "This only takes a few seconds";
  }
</script>
</body>
</html>
